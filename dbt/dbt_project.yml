name: k12att
version: "0.1.0"
config-version: 2
profile: k12att
model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Overridden by the Python runner from k12att.constants, so there is one source.
  chronic_threshold: 0.10
  min_expected_days: 31

models:
  k12att:
    staging:
      +materialized: view
    marts:
      +materialized: table
