[project]
name = "k12-attendance-reporting"
version = "0.1.0"
description = "Validated chronic-absenteeism reporting from synthetic CALPADS-shaped files"
readme = "README.md"
authors = [{ name = "Aaron Adler" }]
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
]

[project.scripts]
k12att = "k12att.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k12att"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["dbt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
